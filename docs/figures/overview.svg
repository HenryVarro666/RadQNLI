<text x="464" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Drop header fragments</text>
<text x="464" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">Keep negatives sharing words</text>
<text x="464" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="770">7,911 / 950 / 977 pairs</text>

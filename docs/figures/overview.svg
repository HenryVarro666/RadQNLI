<text x="589" y="765" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">Accuracy as negatives share more words</text>
<text x="589" y="795" font-size="18" fill="#536777" font-weight="400" data-maxx="1017">with the question: ROUGE-1 &gt; 0 → ≥ 0.3.</text>

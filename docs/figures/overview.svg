<text x="88" y="485" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Each question × each sentence</text>
<text x="88" y="517" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">Answer sentence = entailment</text>
<text x="88" y="549" font-size="18" fill="#5C6D7B" font-weight="400" data-maxx="394">radqa2qnli.py, NLTK split</text>

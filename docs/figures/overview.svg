<text x="60" y="167" font-size="72" fill="#142638" font-weight="500" data-maxx="1540">Generic LLM or fine-tuned model?</text>
<text x="64" y="221" font-size="27" fill="#344C5F" font-weight="400" data-maxx="1536">RadQNLI: does a sentence from a radiology report answer the clinician&#x27;s question?</text>
<text x="64" y="262" font-size="20" fill="#697988" font-weight="400" data-maxx="1536">9,838 question–sentence pairs built from RadQA (MIMIC-III reports); ChatGPT 3-shot on four ROUGE-1 difficulty levels.</text>
<rect x="64" y="323" width="344" height="272" rx="20" fill="#FFFFFF" stroke="#DCE4EB"/>
<rect x="88" y="349" width="44" height="5" rx="2" fill="#3157A4" stroke="none"/>
